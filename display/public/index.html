<head>
  <link rel="stylesheet" type="text/css" media="screen" href="style.css" />
  <link rel="stylesheet" type="text/css" media="screen" href="network-control-panel.css" />
  <link rel="stylesheet" type="text/css" media="screen" href="smart-search.css" />
</head>
<body>
<div class="container mt-5">
  <h1>Alkemio Analytics Demo</h1>
  <div class="graph">
    <h2>Force Directed Graph</h2>
    <div class="graph-container">
      <!-- Fullscreen Toolbar (only visible in fullscreen) -->
      <div id="fullscreen-toolbar" style="display:none;">
        <label style="margin-left:0;">Select Map:
          <select id="graph-map-selector-fs" width="80">
            <option id="europe-fs" value="maps/europe_geo.json" selected="true">Europe</option>
            <option id="netherlands-fs" value="maps/netherlands-with-regions_geo.json">Netherlands</option>
            <option id="ireland-fs" value="maps/ireland-with-counties_geo.json" >Ireland</option>
            <option id="world-fs" value="maps/world.geo.json">World</option>
          </select>
        </label>
        <label>Display Map
          <input type="checkbox" id="graph-display-map-fs" name="display-map-fs">
        </label>
        <label>Display Contributors
          <input type="checkbox" id="graph-checkbox-show-contributors-fs" name="show-contributors-fs">
        </label>
        <label>Move Contributors to Location
          <input type="checkbox" id="graph-contributors-to-location-fs" name="move-contributors-fs">
        </label>
        <label>Move Spaces etc to location
          <input type="checkbox" id="graph-spaces-to-location-fs" name="move-spaces-fs">
        </label>
        <label>3D View
          <input type="checkbox" id="graph-3d-toggle-fs" name="graph-3d-toggle-fs">
        </label>
        <button id="fullscreen-exit-btn" title="Exit Fullscreen">⤫</button>
      </div>
      <!-- Controls bar (compact, only map controls) -->
      <div id="floating-graph-controls" style="margin-bottom: 1.5rem;">
        <div style="background:rgba(255,255,255,0.95);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:10px 24px;display:inline-block;pointer-events:auto;min-width:0;">
          <div class="graph-controls" style="gap:1.2em;">
            <label style="margin-left:0;">Select Map:
              <select id="graph-map-selector" width="80">
                <option id="europe" value="maps/europe_geo.json" selected="true">Europe</option>
                <option id="netherlands" value="maps/netherlands-with-regions_geo.json">Netherlands</option>
                <option id="ireland" value="maps/ireland-with-counties_geo.json" >Ireland</option>
                <option id="world" value="maps/world.geo.json">World</option>
              </select>
            </label>
            <label>Display Map
              <input type="checkbox" id="graph-display-map" name="display-map">
            </label>
            <label>Display Contributors
              <input type="checkbox" id="graph-checkbox-show-contributors" name="show-contributors">
            </label>
            <label>Move Contributors to Location
              <input type="checkbox" id="graph-contributors-to-location" name="move-contributors">
            </label>
            <label>Move Spaces etc to location
              <input type="checkbox" id="graph-spaces-to-location" name="move-spaces">
            </label>
            <label>3D View
              <input type="checkbox" id="graph-3d-toggle" name="graph-3d-toggle">
            </label>
          </div>
          <div style="display:inline-block;vertical-align:middle;">
            <button id="graph-fullscreen-toggle" style="margin-left:1em;">Fullscreen</button>
          </div>
        </div>
      </div>
      <!-- SVG and 3D containers -->
      <svg id="graph-svg" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="graph-3d-container" style="display:none; width:100%; height:600px; position:relative;"></div>
      <!-- Search Bar (below graph, non-fullscreen) -->
      <div id="graph-search-bar" class="search-bar-top">
        <input id="graph-search-input" type="text" placeholder="Search nodes or clusters..." />
      </div>
      <!-- Clear Selection Button (below graph, non-fullscreen) -->
      <div id="graph-clear-selection-bar" class="clear-selection-bar">
        <button id="graph-clear-selection" class="clear-selection-btn" type="button" title="Clear selection">Clear selection</button>
      </div>
      <!-- Info Panel (left side, always present in DOM) -->
      <div id="graph-info-panel" class="info-panel">
        <div class="info-panel-header">
          <span id="graph-info-title">Node Info</span>
          <button id="graph-info-close" title="Close panel">&times;</button>
        </div>
        <div id="graph-info-content" class="info-panel-content">
          <!-- Node details will be injected here -->
        </div>
      </div>
      <!-- Cluster Panel (right side, always present in DOM) -->
      <div id="cluster-panel" class="cluster-panel">
        <div class="cluster-panel-header">
          <span id="cluster-panel-title">Cluster Members</span>
          <button id="cluster-panel-close" title="Close">&times;</button>
        </div>
        <div id="cluster-panel-content" class="cluster-panel-content">
          <!-- Member list will be injected here -->
        </div>
      </div>
      
      <!-- Network Control Panel -->
      <div id="network-control-panel" class="network-control-panel">
        <div class="panel-header">
          <h3>Network Analysis</h3>
          <button id="panel-close" class="panel-close">&times;</button>
        </div>
        
        <!-- Smart Search Section -->
        <div class="panel-section smart-search-container">
          <h4>Smart Search</h4>
          <input type="text" id="smart-search-input" placeholder="Search nodes, patterns, or ask questions...">
          <div id="smart-search-results" class="smart-search-results"></div>
          <div id="search-filter-chips" class="filter-chips"></div>
        </div>
        
        <!-- Visual Controls -->
        <div class="panel-section">
          <h4>Visual Mode</h4>
          <div class="control-group">
            <label>
              <input type="radio" name="visual-mode" value="default" checked>
              Default
            </label>
            <label>
              <input type="radio" name="visual-mode" value="centrality">
              Centrality
            </label>
            <label>
              <input type="radio" name="visual-mode" value="community">
              Communities
            </label>
            <label>
              <input type="radio" name="visual-mode" value="geographic">
              Geographic
            </label>
          </div>
        </div>
        
        <!-- Network Metrics -->
        <div class="panel-section">
          <h4>Network Metrics</h4>
          <div id="network-metrics" class="metrics-grid">
            <!-- Metrics will be populated here -->
          </div>
        </div>
        
        <!-- Analysis Tools -->
        <div class="panel-section">
          <h4>Analysis Tools</h4>
          <div class="tool-grid">
            <button id="find-super-connectors" class="tool-btn">Find Super Connectors</button>
            <button id="detect-communities" class="tool-btn">Detect Communities</button>
            <button id="analyze-centrality" class="tool-btn">Analyze Centrality</button>
            <button id="identify-bridges" class="tool-btn">Find Bridges</button>
          </div>
        </div>
      </div>
      
    </div> <!-- end .graph-container -->
  </div>
  
  <!-- Smart Insights Section -->
  <div class="insights-section" style="
    background: linear-gradient(135deg, #f8fbfd 0%, #eef7fa 100%);
    border-top: 2px solid #e1f0f5;
    padding: 32px 24px;
    margin: 0;
  ">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <div>
          <h2 style="margin: 0; color: #0A6E8A; font-size: 28px; font-weight: 700;">Smart Network Insights</h2>
          <p style="margin: 8px 0 0 0; color: #556B7D; font-size: 16px;">Discover patterns and key relationships in your network</p>
        </div>
        <div style="display: flex; gap: 12px;">
          <button id="refresh-insights-main" class="insight-btn" style="
            background: linear-gradient(135deg, #0A6E8A 0%, #068293 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(10,110,138,0.25);
            transition: all 0.2s;
          ">🔍 Generate Insights</button>
          <button id="export-insights" class="insight-btn" style="
            background: white;
            color: #0A6E8A;
            border: 2px solid #0A6E8A;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
          ">📊 Export</button>
        </div>
      </div>
      
      <!-- Network Metrics Cards -->
      <div id="network-metrics-cards" style="
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      ">
        <!-- Metrics cards will be populated here -->
      </div>
      
      <!-- Insights Grid -->
      <div id="insights-container-main" class="insights-grid" style="
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
      ">
        <!-- Insights will be populated here -->
      </div>
    </div>
  </div>
</div>
<script type="module" src="./bundle.js"></script>
<script type="module">
// Show/hide search bar and clear button depending on fullscreen
function updateSearchBarPosition() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  document.getElementById('graph-search-bar').style.display = fs ? 'none' : '';
  document.getElementById('graph-clear-selection-bar').style.display = fs ? 'none' : '';
  // Always set display:flex for fullscreen toolbar in fullscreen
  document.getElementById('fullscreen-toolbar').style.display = fs ? 'flex' : 'none';
}
document.addEventListener('fullscreenchange', updateSearchBarPosition);
document.addEventListener('webkitfullscreenchange', updateSearchBarPosition);
window.addEventListener('DOMContentLoaded', updateSearchBarPosition);

// --- Unified search logic for both normal and fullscreen search bars ---
function setupGraphSearch(input) {
  if (!input) return;
  input.addEventListener('input', function(e) {
    const value = e.target.value.trim().toLowerCase();
    const svg = document.getElementById('graph-svg');
    if (!svg) return;
    // Remove previous highlights
    svg.querySelectorAll('.node').forEach(el => {
      el.setAttribute('opacity', '1');
      el.setAttribute('stroke', '#0A6E8A');
      el.setAttribute('stroke-width', '1.2');
    });
    svg.querySelectorAll('line').forEach(el => {
      el.setAttribute('opacity', '0.85');
      el.setAttribute('stroke', '#bfc9d1');
      el.setAttribute('stroke-width', '2');
    });
    if (!value) return;
    // Highlight matching nodes and their links
    let found = false;
    svg.querySelectorAll('.node').forEach(el => {
      const d = el.__data__ || {};
      const label = (d.label || d.name || d.id || '').toLowerCase();
      if (label.includes(value)) {
        el.setAttribute('stroke', '#FFD600');
        el.setAttribute('stroke-width', '4');
        el.setAttribute('opacity', '1');
        found = true;
        // Highlight connected links
        svg.querySelectorAll('line').forEach(line => {
          const ld = line.__data__ || {};
          if (ld.source && ld.target && (ld.source.id === d.id || ld.target.id === d.id)) {
            line.setAttribute('stroke', '#FFD600');
            line.setAttribute('stroke-width', '3');
            line.setAttribute('opacity', '1');
          }
        });
      } else {
        el.setAttribute('opacity', '0.15');
      }
    });
    if (found) {
      svg.querySelectorAll('.node').forEach(el => {
        if (el.getAttribute('stroke') !== '#FFD600') {
          el.setAttribute('opacity', '0.15');
        }
      });
      svg.querySelectorAll('line').forEach(line => {
        if (line.getAttribute('stroke') !== '#FFD600') {
          line.setAttribute('opacity', '0.08');
        }
      });
    }
  });
}

window.addEventListener('DOMContentLoaded', function() {
  setupGraphSearch(document.getElementById('graph-search-input'));
});
</script>
<script src="control-panel-integration.js"></script>
</body>
